spring.application.name=istoremanager

# Database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/istoremanagerdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Small pool: free databases allow few connections. Longer timeout lets Neon wake up from sleep.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# No default on purpose: the app must not start without a real secret
jwt.secret=${JWT_SECRET}
cloudinary.url=${CLOUDINARY_URL}

# Comma-separated list of frontend origins (no trailing slash)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Hosts tell the app which port to use through PORT
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB